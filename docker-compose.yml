services:
  secrets-init:
    image: alpine:3.22
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        umask 077 &&
        if [ ! -s /config/s3-secret-access-key ]; then
          od -An -N32 -tx1 /dev/urandom | tr -d ' \n' > /config/s3-secret-access-key;
        fi &&
        chown -R 1000:1000 /config
    volumes:
      - cashier_config:/config

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cashier
      POSTGRES_USER: cashier
      POSTGRES_PASSWORD: cashier-local-only
    volumes:
      - cashier_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cashier -d cashier"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: cashier
      MINIO_ROOT_PASSWORD_FILE: /config/s3-secret-access-key
    volumes:
      - cashier_minio:/data
      - cashier_config:/config:ro
    ports:
      - "${S3_PORT:-9000}:9000"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      secrets-init:
        condition: service_completed_successfully

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 cashier "$$(cat /config/s3-secret-access-key)" &&
        mc mb --ignore-existing local/cashier
    volumes:
      - cashier_config:/config:ro

  app:
    image: ${CASHIER_IMAGE:-ghcr.io/xiangyu-labs/cashier:latest}
    build:
      context: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://cashier:cashier-local-only@postgres:5432/cashier}
      APP_URL: ${APP_URL:-http://localhost:3000}
      AUTH_URL: ${APP_URL:-http://localhost:3000}
      AUTH_TRUST_HOST: "true"
      AUTH_SECRET: ${AUTH_SECRET:-}
      API_KEY_PEPPER: ${API_KEY_PEPPER:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:-cashier}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-cashier}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - cashier_config:/app/config
    depends_on:
      secrets-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

volumes:
  cashier_postgres:
  cashier_minio:
  cashier_config:
