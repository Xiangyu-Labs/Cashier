services:
  app:
    image: ${CASHIER_IMAGE:-ghcr.io/xiangyu-labs/cashier:latest}
    build:
      context: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    environment:
      APP_URL: ${APP_URL:-http://localhost:3000}
      AUTH_URL: ${APP_URL:-http://localhost:3000}
      AUTH_TRUST_HOST: "true"
      AUTH_SECRET: ${AUTH_SECRET:-}
      API_KEY_PEPPER: ${API_KEY_PEPPER:-}
      RATE_LIMIT_PEPPER: ${RATE_LIMIT_PEPPER:-}
      AUTH_OTP_PEPPER: ${AUTH_OTP_PEPPER:-}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - cashier_config:/app/config

volumes:
  cashier_config:
