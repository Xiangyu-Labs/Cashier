name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 18 * * *"

jobs:
  test-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run pull request gate
        run: npm run check:pr

  test-main:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run full main gate
        env:
          # Next.js validates startup configuration while collecting page data.
          # These build-only placeholders match the Dockerfile builder environment.
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
          API_KEY_PEPPER: build-placeholder
          RATE_LIMIT_PEPPER: build-placeholder
          OPENAI_API_KEY: build-placeholder
          AUTH_SECRET: build-placeholder
          AUTH_OTP_PEPPER: build-placeholder
          APP_URL: http://localhost:3000
          S3_ENDPOINT: http://127.0.0.1:9000
          S3_BUCKET: cashier
          S3_ACCESS_KEY_ID: build-placeholder
          S3_SECRET_ACCESS_KEY: build-placeholder
        run: npm run check

  build-and-push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test-main
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/xiangyu-labs/cashier
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
