services:
  postgres-test:
    image: postgres:17-alpine
    container_name: cashier-postgres-test
    environment:
      POSTGRES_USER: cashier
      POSTGRES_PASSWORD: cashier
      POSTGRES_DB: cashier_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cashier -d cashier_test"]
      interval: 1s
      timeout: 3s
      retries: 30
